<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>
        Escolha um número entre 1 e 100.
        O desenho será assinado com o e-mail da sua conta Google.
      </p>
    </header>

    <div
      id="g_id_onload"
      data-client_id="753501095881-8k515tk6vfd4sf3iqh6uu45lv6rp13lj.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular">
    </div>

    <br>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>

      <input
        id="numero"
        name="numero"
        type="number"
        min="1"
        max="100"
        step="1"
        required
        placeholder="42">

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>
    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>
      Baixar SVG
    </button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
